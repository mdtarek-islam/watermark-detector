<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 340" width="960" height="340" role="img" aria-labelledby="t d">
  <title id="t">Watermark Detector training data flow</title>
  <desc id="d">Unsplash search pages feed a download step with tracking and a resumable manifest. PIL synthesises watermarks. The set splits by source photo, then pair generation with an image cache feeds batches of 32 for 20 epochs. Evaluation writes to docs/local.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#58a6ff"/>
    </marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <polygon points="0,1 10,5 0,9" fill="#3fb950"/>
    </marker>
  </defs>
  <style>
    text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .n { fill: #161b22; stroke: #30363d; stroke-width: 1; }
    .f { fill: #161b22; stroke: #58a6ff; stroke-width: 1; }
    .o { fill: #161b22; stroke: #3fb950; stroke-width: 1; }
    .p { fill: #e6edf3; font-size: 14px; text-anchor: middle; }
    .s { fill: #8b949e; font-size: 12px; text-anchor: middle; }
    .l { fill: #8b949e; font-size: 12px; }
    .base { fill: none; stroke: #30363d; stroke-width: 1.5; }
    .flow { fill: none; stroke: #58a6ff; stroke-width: 2; stroke-dasharray: 4 8; animation: pulse 2s linear infinite; }
    .out { fill: none; stroke: #3fb950; stroke-width: 2; stroke-dasharray: 4 8; animation: pulse 2s linear infinite; }
    .d1 { animation-delay: 0s; }
    .d2 { animation-delay: 0.25s; }
    .d3 { animation-delay: 0.5s; }
    .d4 { animation-delay: 0.75s; }
    .d5 { animation-delay: 1s; }
    .d6 { animation-delay: 1.25s; }
    .d7 { animation-delay: 1.5s; }
    .d8 { animation-delay: 1.75s; }
    @keyframes pulse { from { stroke-dashoffset: 12; } to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .flow, .out { animation: none; stroke-dasharray: none; }
    }
  </style>
  <rect width="960" height="340" fill="#0d1117"/>
  <text class="l" x="16" y="34">Training data flow: scripts/collect.py, then wmd-train or scripts/repro.py</text>

  <!-- Row 1 -->
  <rect class="n" x="16" y="70" width="160" height="70" rx="6"/>
  <text class="p" x="96" y="100">Search pages</text><text class="s" x="96" y="120">Unsplash API</text>
  <rect class="n" x="208" y="70" width="160" height="70" rx="6"/>
  <text class="p" x="288" y="100">Download</text><text class="s" x="288" y="120">with tracking</text>
  <rect class="n" x="400" y="70" width="160" height="70" rx="6"/>
  <text class="p" x="480" y="100">Manifest</text><text class="s" x="480" y="120">resumable</text>
  <rect class="n" x="592" y="70" width="160" height="70" rx="6"/>
  <text class="p" x="672" y="100">Watermark synthesis</text><text class="s" x="672" y="120">PIL text and logo</text>
  <rect class="n" x="784" y="70" width="160" height="70" rx="6"/>
  <text class="p" x="864" y="100">Split</text><text class="s" x="864" y="120">by source photo</text>

  <!-- Row 2, right to left -->
  <rect class="n" x="784" y="230" width="160" height="70" rx="6"/>
  <text class="p" x="864" y="260">Pair generation</text><text class="s" x="864" y="280">image cache</text>
  <rect class="n" x="592" y="230" width="160" height="70" rx="6"/>
  <text class="p" x="672" y="260">Batches</text><text class="s" x="672" y="280">32 pairs each</text>
  <rect class="f" x="400" y="230" width="160" height="70" rx="6"/>
  <text class="p" x="480" y="260">Training</text><text class="s" x="480" y="280">20 epochs</text>
  <rect class="o" x="208" y="230" width="160" height="70" rx="6"/>
  <text class="p" x="288" y="260">Evaluation</text><text class="s" x="288" y="280">writes to docs/local</text>

  <!-- Base connectors -->
  <path class="base" d="M176 105 H208 M368 105 H400 M560 105 H592 M752 105 H784 M864 140 V230 M784 265 H752 M592 265 H560 M400 265 H368"/>

  <!-- Animated connectors -->
  <path class="flow d1" d="M176 105 H206" marker-end="url(#ah)"/>
  <path class="flow d2" d="M368 105 H398" marker-end="url(#ah)"/>
  <path class="flow d3" d="M560 105 H590" marker-end="url(#ah)"/>
  <path class="flow d4" d="M752 105 H782" marker-end="url(#ah)"/>
  <path class="flow d5" d="M864 140 V228" marker-end="url(#ah)"/>
  <path class="flow d6" d="M784 265 H754" marker-end="url(#ah)"/>
  <path class="flow d7" d="M592 265 H562" marker-end="url(#ah)"/>
  <path class="out d8" d="M400 265 H370" marker-end="url(#ag)"/>
</svg>
